# Publishes the folder owner-stats/ (the owner's page: docs/stats.md) to GitHub Pages. It does nothing here: copy it to
# .github/workflows/owner-stats-pages.yml once Pages is set to "GitHub Actions" in the repository's settings, and run it from the Actions tab.
name: Owner stats page
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: owner-stats
      - id: deployment
        uses: actions/deploy-pages@v4
